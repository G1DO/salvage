name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.92.0
          components: clippy, rustfmt

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Ensure PostgreSQL 16 is available
        run: |
          if [ -d /usr/lib/postgresql/16/bin ]; then
            echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          elif ! command -v initdb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16 postgresql-client-16
            echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          fi

      - name: Run repository verification
        run: ./scripts/verify.sh

      - name: Run blackbox recovery drill and generate evidence bundle
        run: |
          cargo run -p salvage-cli --locked -- run tests/fixtures/manifest-valid-pg16-restore.json \
            --backup tests/fixtures/valid-pg16-custom.dump \
            --run-dir target/recovery-evidence
          ls -la target/recovery-evidence/

      - name: Run Docker E2E boot tests
        run: |
          SALVAGE_TEST_DOCKER=1 cargo test --test e2e_boot --locked -- --ignored
          SALVAGE_TEST_DOCKER=1 cargo test -p salvage-oci --test boot_integration --locked -- --ignored

      - name: Run Docker E2E contracts matrix (O3-5)
        run: |
          SALVAGE_TEST_DOCKER=1 cargo test --test e2e_contracts --locked -- --ignored

      - name: Run Docker E2E fault matrix (O4-1)
        run: |
          SALVAGE_TEST_DOCKER=1 SALVAGE_FAULT_MATRIX_REPEATS=2 cargo test --test e2e_faults --locked -- --ignored

      - name: Run v3 contracts drill and generate evidence bundle
        run: |
          docker build -t salvage-tiny-http:test tests/fixtures/images/tiny-http
          DIGEST=$(docker image inspect salvage-tiny-http:test --format '{{.Id}}')
          HEX=${DIGEST#sha256:}
          sed "s/e22a313ea41b0ce4bc1919997a651a41fc0ae71eaf7d605bc2cbfd03e0a32cb8/${HEX}/" \
            tests/fixtures/manifest-valid-v3-e2e.json > /tmp/manifest-v3-e2e.json
          python3 -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID || true' EXIT
          cargo run -p salvage-cli --locked -- run /tmp/manifest-v3-e2e.json \
            --backup tests/fixtures/valid-pg16-custom.dump \
            --run-dir target/recovery-evidence-v3
          ls -la target/recovery-evidence-v3/
          kill $HTTP_PID
          trap - EXIT

      - name: Upload recovery evidence bundle
        uses: actions/upload-artifact@v7
        with:
          name: recovery-evidence
          path: |
            target/recovery-evidence/evidence.json
            target/recovery-evidence/report.html
            target/recovery-evidence/journal.jsonl
            target/recovery-evidence/state.json
            target/recovery-evidence-v3/evidence.json
            target/recovery-evidence-v3/report.html
            target/recovery-evidence-v3/journal.jsonl
            target/recovery-evidence-v3/state.json
          if-no-files-found: error

